<section class="why" aria-label="למה DOORS LINE">
<div><h3>ייצור לפי מידה</h3><p>כל דלת מיוצרת בדיוק לפתח שלכם, מודד יוצא אליכם לשטח, מודד במדויק, והדלת מיוצרת בדיוק לפתח.</p></div>
<div><h3>חומרים לכל חלל</h3><p>חיפויי HPL, HPLG איטלקי, פורצלן שייש ואלומיניום, על חומר פולימרי או פלדה, ובדלתות כניסה גם צבע תנור.</p></div>
<div><h3>התקנה מקצועית</h3><p>מדידה, ייעוץ והתקנה בידי צוות מנוסה, עם אחריות על העבודה.</p></div>
</section>

 document.body.appendChild(g);$("pin").focus();
 function go(){$("pe").textContent="בודק...";crypto.subtle.importKey("raw",new TextEncoder().encode($("pin").value),"PBKDF2",false,["deriveKey"]).then(function(m){return crypto.subtle.deriveKey({name:"PBKDF2",salt:ub(EMB.s),iterations:300000,hash:"SHA-256"},m,{name:"AES-GCM",length:256},false,["decrypt"])}).then(function(k){return crypto.subtle.decrypt({name:"AES-GCM",iv:ub(EMB.i)},k,ub(EMB.d))}).then(function(b){g.remove();startAdmin(new TextDecoder().decode(b))},function(){$("pe").textContent="קוד שגוי"})}

 else if(k==="mo"){var p=r.split(":"),m=MODELS[+p[0]],f=p[1],d2=f==="n"?m.n:m.d;textDlg(label,getTxt(el),f==="d",true,function(v){var o=ST.mo[m.n]=ST.mo[m.n]||{};if(v===null||!v.trim()||v===d2)delete o[f];else o[f]=v;mark();remod()})}
 else if(k==="cat"){textDlg(label,getTxt(el),false,true,function(v){if(v===null||!v.trim()||v===r)delete ST.catl[r];else ST.catl[r]=v;mark();gal()})}

 var html='<div class="dthumb"><div class="dtp" id="spv"'+(pic?' style="padding:0;background:none"':"")+'>'+(pic?'<img src="'+esc(pic.u||"/_blob/"+pic.id)+'" alt="" style="width:100%;display:block;border-radius:4px">':door(s,{id:"spv"}))+'</div><div style="flex:1"><div class="fld" style="margin:0;grid-template-columns:1fr 1fr"><label>צבע<input type="color" id="sp_cc" value="'+(s.cc||"#efece6")+'" style="height:44px;padding:2px"></label><label class="ck" style="margin-top:22px"><input type="checkbox" id="sp_line"'+(s.line?" checked":"")+'> פס קישוט</label></div></div></div><div class="fld">'
 +sel("sp_type","סוג דלת",L.map(function(t){return [t,nm(TYPES,t)]}),s.type)+sel("sp_mat","חומר",MATS.map(function(a){return [a.id,a.n]}),s.mat)

 +'<label>רוחב (ס״מ)<input type="number" id="sp_w" min="60" max="160" value="'+s.w+'"></label><label>גובה (ס״מ)<input type="number" id="sp_h" min="190" max="320" value="'+s.h+'"></label></div>';
 dlg({title:"עיצוב הדלת: "+((ST.mo[m.n]||{}).n||m.n),html:html,
